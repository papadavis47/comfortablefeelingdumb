allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Transitive-only bumps to clear Dependabot advisories. All are dev/build-time
# deps; drop an entry once a direct dependency requires the patched range itself.
# Major-scoped keys (pkg@N) keep each major on its own patched line — a blanket
# override would collapse 1.x/2.x/5.x consumers onto one version.
overrides:
  esbuild: ^0.28.1 # dev-server file read (Windows)
  postcss: ^8.5.23 # XSS via unescaped </style> in stringify; next pins 8.4.31
  brace-expansion@1: ^1.1.18 # ReDoS
  brace-expansion@2: ^2.1.2 # ReDoS
  js-yaml@3: ^3.15.1 # prototype pollution
  js-yaml@4: ^4.3.1 # prototype pollution
  nanoid@3: ^3.3.17 # predictable IDs w/ non-integer size
