version: 2
updates:
  - package-ecosystem: npm # covers pnpm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # one PR for all non-breaking bumps; majors still get their own PR
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # held back by eslint-config-next dep tree — see AGENTS.md "Held-back majors"
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
